<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TollBooth Simulator (OpenStreetMap)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, Arial; }
    #app { display: grid; grid-template-columns: 2fr 1fr; height: 100%; }
    #map { height: 100%; }
    #panel { padding: 12px; overflow: auto; border-left: 1px solid #ddd; }
    h2 { margin: 0 0 8px; }
    .row { margin: 10px 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { padding: 6px 10px; border: 1px solid #999; background:#f8f8f8; cursor:pointer; border-radius:6px; }
    .btn:hover { background:#eee; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 4px; text-align: left; }
    .ok { color:#0a7a2a; font-weight:600; }
    .fine { color:#b7791f; font-weight:600; }
    .free { color:#0f63b6; font-weight:600; }
    .muted { color:#666; font-size:12px; }
    .chip { display:inline-block; padding:2px 6px; border-radius:999px; border:1px solid #bbb; font-size:11px; }
    .legend { display:flex; flex-wrap:wrap; gap:6px; }
    .sim-marker-icon { background: transparent; border: 0; }
    .sim-marker-icon span {
      display: flex; align-items: center; justify-content: center;
      min-width: 28px; height: 28px; padding: 0 4px; border: 2px solid #333;
      border-radius: 50%; background: white; color: #111; font-size: 14px;
      font-weight: 700; white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <h2>Toll Booth Simulator</h2>
    <div class="muted">Speed of simulation is accelerated; times are in minutes (logical), not real-time.</div>

    <div class="row grid2">
      <label>Vehicles to simulate:
        <input id="numVehicles" type="number" min="1" max="1000" value="60" style="width:100%;">
      </label>
      <label>Default Traffic Wait (min):
        <input id="trafficWait" type="number" min="0" value="10" style="width:100%;">
      </label>
    </div>

    <div class="row grid2">
      <label>Animation speed (ms per step):
        <input id="animMs" type="number" min="10" value="50" style="width:100%;">
      </label>
      <label>Path seconds per km (visual only):
        <input id="secPerKm" type="number" min="1" value="30" style="width:100%;">
      </label>
    </div>

    <div class="row">
      <button id="spawnBtn" class="btn">Spawn & Run Simulation</button>
      <button id="resetBtn" class="btn">Reset</button>
    </div>

    <div class="row legend" id="legend"></div>

    <div class="row">
      <b>Totals</b><br/>
      <span class="chip">Crossed: <span id="totalCrossed">0</span></span>
      <span class="chip">Paid: ₹<span id="totalToll">0</span></span>
      <span class="chip">Penalties: ₹<span id="totalFine">0</span></span>
    </div>

    <div class="row">
      <table id="resultTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Type</th>
            <th>Arrived (min)</th>
            <th>Waited (min)</th>
            <th>Outcome</th>
            <th>Toll (₹)</th>
            <th>Penalty (₹)</th>
            <th>Horns</th>
            <th>Pollution</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</div>

<script>
/** ================== Domain Setup ================== **/

// Fixed toll charges & waiting limits (minutes).
// You can tweak these easily.
const VEHICLE_TYPES = [
  { key: 'TWO',  name: 'Two-wheeler',       toll: 30,  waitLimit: 2,  color: '#4caf50' },
  { key: 'THREE',name: 'Three-wheeler',     toll: 50,  waitLimit: 3,  color: '#009688' },
  { key: 'FOUR', name: 'Four-wheeler',      toll: 100, waitLimit: 4,  color: '#2196f3' },
  { key: 'SIX',  name: 'Six-wheeler',       toll: 180, waitLimit: 5,  color: '#673ab7' },
  { key: 'CONT', name: 'Container truck',   toll: 250, waitLimit: 6,  color: '#9c27b0' },
  { key: 'AMB',  name: 'Ambulance',         toll: 0,   waitLimit: 0,  exempt: true, color: '#e91e63' },
  { key: 'GOV',  name: 'Government vehicle',toll: 0,   waitLimit: 0,  exempt: true, color: '#ff9800' },
  { key: 'GBUS', name: 'Government bus',    toll: 0,   waitLimit: 0,  exempt: true, color: '#ff5722' },
  { key: 'EXEM', name: 'Exempted (locals)', toll: 0,   waitLimit: 0,  exempt: true, color: '#795548' },
];

const FINES = {
  hornOverLimit: 200,      // extra fine if horns > 5
  pollution: 500           // extra fine if pollution flag = true
};

// marker glyph/icon per type (simple emoji labels for clarity; replace with custom icons if you want)
const TYPE_ICON = {
  'TWO':  '🛵',
  'THREE':'🛺',
  'FOUR': '🚗',
  'SIX':  '🚚',
  'CONT': '🚛',
  'AMB':  '🚑',
  'GOV':  '🚘',
  'GBUS': '🚌',
  'EXEM': '🎫'
};

// Global map objects
let map, tollMarker, vehicleMarkers = [];
let polylines = [];

// Toll booth fixed point (lat, lng). Change to your actual location if you want.
const TOLL_LOCATION = { lat: 19.0760, lng: 72.8777 }; // Mumbai center-ish

// We’ll spawn vehicles from randomized starting points around the toll within this radius (km)
const SPAWN_RADIUS_KM = 1.0;

// Simulation state
let SIM = {
  running: false,
  rows: [],         // per-vehicle results for the table
  totals: { crossed: 0, toll: 0, fine: 0 }
};

/** ================== Utilities ================== **/

function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b){ return Math.floor(a + Math.random()*(b-a+1)); } // inclusive
function randFloat(a,b){ return a + Math.random()*(b-a); }
function toRad(d){ return d * Math.PI / 180; }

function haversineKm(a, b) {
  const R = 6371;
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lng - a.lng);
  const la1 = toRad(a.lat), la2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function offsetPoint(center, radiusKm) {
  // random point within a circle
  const r = radiusKm * Math.sqrt(Math.random());
  const theta = Math.random() * 2 * Math.PI;
  const dx = r * Math.cos(theta);
  const dy = r * Math.sin(theta);
  // very rough conversion: 1 deg lat ≈ 111 km; lng scales by cos(lat)
  const lat = center.lat + (dy / 111);
  const lng = center.lng + (dx / (111 * Math.cos(toRad(center.lat))));
  return { lat, lng };
}

function currency(n){ return Number(n).toFixed(0); }

/** ================== OpenStreetMap Setup ================== **/

function leafletPoint(point){
  return [point.lat, point.lng];
}

function createMarker(options){
  const label = typeof options.label === 'object' ? options.label.text : options.label;
  const icon = L.divIcon({
    className: 'sim-marker-icon',
    html: `<span>${label || '•'}</span>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18]
  });
  return L.marker(leafletPoint(options.position), { title: options.title, icon }).addTo(map);
}

function initMap(){
  map = L.map('map').setView(leafletPoint(TOLL_LOCATION), 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  tollMarker = createMarker({
    position: TOLL_LOCATION, title: 'Toll Booth',
    label: { text: 'Toll', color: '#000', fontWeight: '700' }
  });
  // draw a small circle around the toll for aesthetics
  L.circle(leafletPoint(TOLL_LOCATION), {
    color: '#0f63b6', opacity: 0.8, weight: 1,
    fillColor: '#0f63b6', fillOpacity: 0.08, radius: 120
  }).addTo(map);

  // legend
  const legend = document.getElementById('legend');
  VEHICLE_TYPES.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'chip';
    div.style.borderColor = t.color;
    div.innerHTML = `<span style="font-size:14px;">${TYPE_ICON[t.key]||'•'}</span> ${t.name}`;
    legend.appendChild(div);
  });

  // wire buttons
  document.getElementById('spawnBtn').onclick = () => startSimulation();
  document.getElementById('resetBtn').onclick = () => resetAll();
}

/** ================== Simulation Core ================== **/

async function startSimulation(){
  if (SIM.running) return;
  SIM.running = true;

  resetVisualsOnly();

  const n = Number(document.getElementById('numVehicles').value || 60);
  const defaultWait = Number(document.getElementById('trafficWait').value || 10);
  const secPerKm = Number(document.getElementById('secPerKm').value || 30);
  const animMs = Number(document.getElementById('animMs').value || 50);

  // spawn vehicles
  const vehicles = [];
  for (let i=0;i<n;i++){
    const type = randChoice(VEHICLE_TYPES);
    const start = offsetPoint(TOLL_LOCATION, SPAWN_RADIUS_KM);
    const arrivalMin = randInt(0, 30); // logical arrival minute window
    const horns = randInt(0, 9);       // horns used during waiting
    const pollution = Math.random() < 0.15; // 15% chance
    vehicles.push({
      id: i+1,
      type,
      start,
      arrivalMin,
      horns,
      pollution
    });
  }

  // place markers and animate towards toll in batches (to keep UI responsive)
  const chunkSize = 10;
  for (let i=0; i<vehicles.length; i+=chunkSize){
    const chunk = vehicles.slice(i, i+chunkSize);
    await Promise.all(chunk.map(v => animateVehicle(v, secPerKm, animMs)));
  }

  // compute outcomes (waiting logic, tolls & fines)
  computeOutcomes(vehicles, defaultWait);

  // update table & totals
  renderTable(SIM.rows);
  updateTotals();
  SIM.running = false;
}

function resetAll(){
  SIM = { running:false, rows:[], totals:{ crossed:0, toll:0, fine:0 } };
  resetVisualsOnly();
  renderTable([]);
  updateTotals();
}

function resetVisualsOnly(){
  vehicleMarkers.forEach(m => m.remove());
  vehicleMarkers = [];
  polylines.forEach(p => p.remove());
  polylines = [];
}

function markerForType(t){
  // Use colored default marker with emoji label
  return { label: TYPE_ICON[t.key] || '•' };
}

async function animateVehicle(v, secPerKm, animMs){
  // marker at start
  const marker = createMarker({
    position: v.start,
    title: `${v.type.name} #${v.id}`,
    label: markerForType(v.type).label
  });
  vehicleMarkers.push(marker);

  // draw a polyline path (straight line for simplicity)
  const path = [ v.start, TOLL_LOCATION ];
  const poly = L.polyline(path.map(leafletPoint), {
    opacity: 0.6, weight: 3, color: v.type.color
  }).addTo(map);
  polylines.push(poly);

  // move marker along polyline
  const totalKm = haversineKm(v.start, TOLL_LOCATION);
  const totalSeconds = totalKm * secPerKm;  // visual only
  const steps = Math.max(20, Math.floor(totalSeconds)); // smoothness
  for (let i=1;i<=steps;i++){
    const t = i/steps;
    const lat = v.start.lat + (TOLL_LOCATION.lat - v.start.lat) * t;
    const lng = v.start.lng + (TOLL_LOCATION.lng - v.start.lng) * t;
    marker.setLatLng([lat, lng]);
    await sleep(animMs);
  }
  // finally ensure it snaps to toll
  marker.setLatLng(leafletPoint(TOLL_LOCATION));
}

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

function computeOutcomes(vehicles, defaultWait){
  const rows = [];
  let totalToll = 0, totalFine = 0, crossed = 0;

  vehicles.forEach(v => {
    // Each vehicle "arrives" and faces default traffic waiting time
    const waitedMin = defaultWait; // can be customized per type/traffic if needed

    // Rules:
    // - Exempt types never pay.
    // - Non-exempt: if waited > type.waitLimit => free pass; else pay toll.
    let payToll = 0;
    let outcome = '';
    const isExempt = !!v.type.exempt;

    if (isExempt){
      payToll = 0;
      outcome = 'Free (Exempt)';
    } else {
      if (waitedMin > v.type.waitLimit){
        payToll = 0;
        outcome = 'Free (Exceeded wait limit)';
      } else {
        payToll = v.type.toll;
        outcome = 'Paid';
      }
    }

    // Penalties:
    // horn > 5 => fine
    // pollution => fine
    let penalty = 0;
    if (v.horns > 5) penalty += FINES.hornOverLimit;
    if (v.pollution) penalty += FINES.polution ?? FINES.pollution; // support older typo
    const penaltyNote = penalty > 0 ? ' + Penalty' : '';

    // Summaries
    totalToll += payToll;
    totalFine += penalty;
    crossed++;

    rows.push({
      id: v.id,
      type: v.type.name,
      arrived: v.arrivalMin,
      waited: waitedMin,
      outcome: (payToll>0 ? 'Paid' : (isExempt ? 'Free (Exempt)' : 'Free (Wait)')) + (penalty? ' + Fined':''),
      toll: payToll,
      penalty: penalty,
      horns: v.horns,
      pollution: v.pollution ? 'Yes' : 'No'
    });

    // After crossing, update marker label color/state (optional)
    // (Kept simple here to avoid flicker.)
  });

  SIM.rows = rows;
  SIM.totals = { crossed, toll: totalToll, fine: totalFine };
}

function renderTable(rows){
  const tbody = document.querySelector('#resultTable tbody');
  tbody.innerHTML = '';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const cls =
      r.outcome.includes('Fined') ? 'fine' :
      r.outcome.startsWith('Free') ? 'free' : 'ok';

    tr.innerHTML = `
      <td>${r.id}</td>
      <td>${r.type}</td>
      <td>${r.arrived}</td>
      <td>${r.waited}</td>
      <td class="${cls}">${r.outcome}</td>
      <td>₹${currency(r.toll)}</td>
      <td>₹${currency(r.penalty)}</td>
      <td>${r.horns}</td>
      <td>${r.pollution}</td>
    `;
    tbody.appendChild(tr);
  });
}

function updateTotals(){
  document.getElementById('totalCrossed').innerText = SIM.totals.crossed;
  document.getElementById('totalToll').innerText   = currency(SIM.totals.toll);
  document.getElementById('totalFine').innerText   = currency(SIM.totals.fine);
}

</script>

<script>
  initMap();
</script>
</body>
</html>
